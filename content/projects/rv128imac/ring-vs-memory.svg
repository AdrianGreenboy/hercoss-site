<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img"><rect width="1200" height="520" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">HOW ONE CORE ASKS ANOTHER FOR WORK · CONCEPT</text><rect x="30" y="70" width="1140" height="190" fill="#151a21" stroke="#3a4350" stroke-width="2" /><text x="54" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="700" letter-spacing="0">Usual multicore chip: through shared memory and the operating system</text><rect x="54" y="130" width="110" height="52" fill="#0d1014" stroke="#5b9bd5" stroke-width="3" rx="6"/><text x="109.0" y="162" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#5b9bd5" text-anchor="middle" font-weight="700" letter-spacing="0">CORE A</text><rect x="210" y="130" width="150" height="52" fill="#0d1014" stroke="#9aa4b2" stroke-width="3" rx="6"/><text x="285.0" y="154" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="0">SYSTEM CALL</text><text x="285.0" y="172" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">kernel</text><rect x="406" y="130" width="120" height="52" fill="#0d1014" stroke="#9aa4b2" stroke-width="3" rx="6"/><text x="466.0" y="162" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="0">DRIVER</text><rect x="572" y="130" width="170" height="52" fill="#0d1014" stroke="#9aa4b2" stroke-width="3" rx="6"/><text x="657.0" y="154" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="0">SHARED MEMORY</text><text x="657.0" y="172" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">buffer</text><rect x="788" y="130" width="140" height="52" fill="#0d1014" stroke="#9aa4b2" stroke-width="3" rx="6"/><text x="858.0" y="162" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="0">INTERRUPT</text><rect x="974" y="130" width="110" height="52" fill="#0d1014" stroke="#5b9bd5" stroke-width="3" rx="6"/><text x="1029.0" y="162" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#5b9bd5" text-anchor="middle" font-weight="700" letter-spacing="0">CORE B</text><line x1="168" y1="156" x2="196" y2="156" stroke="#9aa4b2" stroke-width="2.5"/><polygon points="206,156 194,149 194,163" fill="#9aa4b2"/><line x1="364" y1="156" x2="392" y2="156" stroke="#9aa4b2" stroke-width="2.5"/><polygon points="402,156 390,149 390,163" fill="#9aa4b2"/><line x1="530" y1="156" x2="558" y2="156" stroke="#9aa4b2" stroke-width="2.5"/><polygon points="568,156 556,149 556,163" fill="#9aa4b2"/><line x1="746" y1="156" x2="774" y2="156" stroke="#9aa4b2" stroke-width="2.5"/><polygon points="784,156 772,149 772,163" fill="#9aa4b2"/><line x1="932" y1="156" x2="960" y2="156" stroke="#9aa4b2" stroke-width="2.5"/><polygon points="970,156 958,149 958,163" fill="#9aa4b2"/><text x="54" y="232" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Several software layers and memory round trips: microseconds to tens of microseconds, and lots of code.</text><rect x="30" y="290" width="1140" height="200" fill="#151a21" stroke="#f2a03d" stroke-width="2" /><text x="54" y="324" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">HERCOSS core fabric: directly, in hardware</text><rect x="54" y="352" width="110" height="52" fill="#0d1014" stroke="#5b9bd5" stroke-width="3" rx="6"/><text x="109.0" y="384" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#5b9bd5" text-anchor="middle" font-weight="700" letter-spacing="0">CORE A</text><rect x="230" y="368" width="560" height="20" rx="10" fill="#f2a03d" opacity=".25"/><line x1="172" y1="378" x2="810" y2="378" stroke="#f2a03d" stroke-width="2.5"/><polygon points="820,378 808,371 808,385" fill="#f2a03d"/><text x="510" y="360" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#e6e9ee" text-anchor="middle" font-weight="700" letter-spacing="0">one instruction · over the ring</text><rect x="830" y="352" width="110" height="52" fill="#0d1014" stroke="#5b9bd5" stroke-width="3" rx="6"/><text x="885.0" y="384" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#5b9bd5" text-anchor="middle" font-weight="700" letter-spacing="0">CORE B</text><text x="960" y="374" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">or</text><rect x="990" y="352" width="150" height="52" fill="#0d1014" stroke="#6fcf97" stroke-width="3" rx="6"/><text x="1065.0" y="384" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#6fcf97" text-anchor="middle" font-weight="700" letter-spacing="0">SHA-3 ENGINE</text><text x="54" y="456" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">1.35 µs round trip from a Linux program (≈5× faster than an empty system call) · SHA-3 at 129 MB/s, no driver</text><text x="54" y="478" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Measured on the FPGA prototype at 60 MHz.</text></svg>