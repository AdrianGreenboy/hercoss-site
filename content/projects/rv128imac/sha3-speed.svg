<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><rect width="1000" height="470" fill="#0d1014"/><text x="40" y="50" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">SHA3-256 THROUGHPUT · SAME CPU · FPGA PROTOTYPE @ 60 MHz</text><text x="40" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Software on the CPU</text><text x="40" y="124" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Linux process</text><rect x="330" y="88" width="4.439024390243903" height="36" fill="#5b6675" stroke="#5b6675" stroke-width="2" /><text x="346.4390243902439" y="113" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">0.7 MB/s</text><text x="40" y="170" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Hardware engine, first version</text><text x="40" y="190" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Linux process</text><rect x="330" y="154" width="209.26829268292684" height="36" fill="#2b3440" stroke="#2b3440" stroke-width="2" /><text x="551.2682926829268" y="179" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">33 MB/s</text><text x="40" y="236" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Same engine, smarter software</text><text x="40" y="256" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Linux process</text><rect x="330" y="220" width="336.0975609756098" height="36" fill="#2b3440" stroke="#2b3440" stroke-width="2" /><rect x="666.0975609756098" y="220" width="44.39024390243901" height="36" fill="#2b3440" stroke="#2b3440" stroke-width="2" opacity="0.5"/><text x="722.4878048780488" y="245" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">53–60 MB/s</text><text x="40" y="302" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">After profiling, core improved</text><text x="40" y="322" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Linux process</text><rect x="330" y="286" width="472.4390243902439" height="36" fill="#f2a03d" stroke="#f2a03d" stroke-width="2" /><text x="814.439024390244" y="311" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">74.5 MB/s  ×94</text><text x="40" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Same, bare metal</text><text x="40" y="388" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">No operating system</text><rect x="330" y="352" width="520.0" height="36" fill="#c98532" stroke="#c98532" stroke-width="2" /><text x="862.0" y="377" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">82 MB/s</text><text x="40" y="440" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Software speed varies up to 22 % between boots, so the speed-up is given as a range: ×69 to ×94.</text></svg>