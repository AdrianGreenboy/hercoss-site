ight="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><rect x="1042" y="179" width="36" height="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><text x="1060.0" y="232" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">17</text><rect x="1094" y="90" width="56" height="120" fill="#151a21" stroke="#6fcf97" stroke-width="2" rx="5"/><rect x="1104" y="104" width="36" height="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><rect x="1104" y="129" width="36" height="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><rect x="1104" y="154" width="36" height="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><rect x="1104" y="179" width="36" height="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" opacity=".75"/><text x="1122.0" y="232" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">18</text><text x="40" y="264" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#5b9bd5" text-anchor="start" font-weight="700" letter-spacing="0">16 data chips (64 bits)</text><text x="1032" y="264" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">2 ECC chips (8 bits)</text><rect x="40" y="290" width="1120" height="120" fill="#14221a" stroke="#6fcf97" stroke-width="2" rx="8"/><text x="64" y="330" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">A whole memory chip dies. The data still comes back correct.</text><text x="64" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Chip-level protection corrects the complete failure of one chip, then a known-dead chip plus one more error.</text><text x="64" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Anything beyond that is marked as poisoned: corrupted data is never passed on silently.</text></svg>