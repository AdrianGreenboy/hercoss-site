<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><rect width="1200" height="560" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">ONE HOUR ON SILICON · A SWITCH KILLED AND REVIVED AT RANDOM, UNDER FULL TRAFFIC · 255 MHz</text><rect x="40" y="70" width="1120" height="150" fill="#1c1a14" stroke="#f2a03d" stroke-width="3" rx="10"/><text x="76" y="160" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="76" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">405,522</text><text x="470" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">switch failures in one hour</text><text x="470" y="162" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Random timing, from microseconds to tens of milliseconds,</text><text x="470" y="186" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">including failures that strike while the previous repair is still in place.</text><rect x="40.0" y="240" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="40.0" y="240" width="6" height="134" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" /><text x="64.0" y="290" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">324,687</text><text x="64.0" y="320" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">repairs measured</text><text x="64.0" y="344" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">all between 148 and 156 clock cycles</text><rect x="420.0" y="240" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="420.0" y="240" width="6" height="134" fill="#5b9bd5" stroke="#5b9bd5" stroke-width="0" /><text x="444.0" y="290" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#5b9bd5" text-anchor="start" font-weight="700" letter-spacing="0">80,835</text><text x="444.0" y="320" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">failures absorbed</text><text x="444.0" y="344" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">struck while the repair was in place: the</text><text x="444.0" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">lane never went down</text><rect x="800.0" y="240" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="800.0" y="240" width="6" height="134" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" /><text x="824.0" y="290" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">6,336 / 6,336</text><text x="824.0" y="320" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">returns home checked</text><text x="824.0" y="344" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">original configuration restored every time</text><rect x="40.0" y="390" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="40.0" y="390" width="6" height="134" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" /><text x="64.0" y="440" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">160 bn+</text><text x="64.0" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">stream data words</text><text x="64.0" y="494" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">none lost, none damaged</text><rect x="420.0" y="390" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="420.0" y="390" width="6" height="134" fill="#5b9bd5" stroke="#5b9bd5" stroke-width="0" /><text x="444.0" y="440" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#5b9bd5" text-anchor="start" font-weight="700" letter-spacing="0">24.8 bn</text><text x="444.0" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">memory transaction batches</text><text x="444.0" y="494" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">alongside, zero errors</text><rect x="800.0" y="390" width="360.0" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="8"/><rect x="800.0" y="390" width="6" height="134" fill="#f2a03d" stroke="#f2a03d" stroke-width="0" /><text x="824.0" y="440" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">0</text><text x="824.0" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">software involved</text><text x="824.0" y="494" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">no route tables, no central controller</text></svg>