 stroke="#3a4350" stroke-width="2" /><rect x="480" y="72" width="6" height="134" fill="#6fcf97" stroke="#6fcf97" stroke-width="0" /><text x="506" y="108" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">1 NODE DIES</text><text x="506" y="156" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">0 words lost</text><text x="810" y="124" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">6 nodes switched off one after another;</text><text x="810" y="145" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">up to 16 protected groups lost a path at</text><text x="810" y="166" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">the same moment.</text><rect x="480" y="222" width="680" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" /><rect x="480" y="222" width="6" height="134" fill="#f2a03d" stroke="#f2a03d" stroke-width="0" /><text x="506" y="258" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">THE NETWORK HEALS</text><text x="506" y="306" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">~4 µs</text><text x="810" y="274" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">Back to full protection on other routes</text><text x="810" y="295" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">in ~1000 cycles at 265 MHz, today for</text><text x="810" y="316" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">about two thirds of the paths.</text><rect x="480" y="372" width="680" height="134" fill="#151a21" stroke="#3a4350" stroke-width="2" /><rect x="480" y="372" width="6" height="134" fill="#5b9bd5" stroke="#5b9bd5" stroke-width="0" /><text x="506" y="408" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">2 NODES DIE TOGETHER</text><text x="506" y="456" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="32" fill="#5b9bd5" text-anchor="start" font-weight="700" letter-spacing="0">27 / 35</text><text x="810" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">groups lose nothing; in the other 8</text><text x="810" y="445" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">every lost word is counted, none is</text><text x="810" y="466" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">delivered wrong, and the network</text><text x="810" y="487" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">restores itself.</text></svg>