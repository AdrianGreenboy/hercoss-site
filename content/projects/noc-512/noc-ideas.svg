start" font-weight="400" letter-spacing="0">would stop the repair itself.</text><rect x="895.0" y="76" width="265.0" height="220" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="10"/><circle cx="941.0" cy="128" r="24" fill="none" stroke="#f2a03d" stroke-width="4"/><line x1="924.0" y1="145" x2="958.0" y2="111" stroke="#f2a03d" stroke-width="4"/><text x="981.0" y="122" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="2">NO</text><text x="981.0" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">To be told what</text><text x="981.0" y="166" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">failed</text><text x="917.0" y="206" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Nobody tells the network which</text><text x="917.0" y="227" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">switch is gone.</text></svg>