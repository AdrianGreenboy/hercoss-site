<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><rect width="1200" height="330" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">WHAT THE NETWORK DOES NOT NEED TO HEAL ITSELF</text><rect x="40.0" y="76" width="265.0" height="220" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="10"/><circle cx="86.0" cy="128" r="24" fill="none" stroke="#f2a03d" stroke-width="4"/><line x1="69.0" y1="145" x2="103.0" y2="111" stroke="#f2a03d" stroke-width="4"/><text x="126.0" y="122" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="2">NO</text><text x="126.0" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Software</text><text x="62.0" y="206" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">The repair is over before a</text><text x="62.0" y="227" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">processor would even notice an</text><text x="62.0" y="248" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">interrupt.</text><rect x="325.0" y="76" width="265.0" height="220" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="10"/><circle cx="371.0" cy="128" r="24" fill="none" stroke="#f2a03d" stroke-width="4"/><line x1="354.0" y1="145" x2="388.0" y2="111" stroke="#f2a03d" stroke-width="4"/><text x="411.0" y="122" font-family="DejaVu Sans Mono, ui-mo