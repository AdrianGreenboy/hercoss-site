ill="#6fcf97" text-anchor="start" font-weight="800" letter-spacing="0">✓ Nie eine Schleife</text><text x="494" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">keine Konfiguration und kein Ausfallmuster lässt die Switches eine Schleife bilden</text><text x="1140" y="102" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#6fcf97" text-anchor="end" font-weight="800" letter-spacing="2">BEWIESEN</text><rect x="470" y="194" width="690" height="110" fill="#141a14" stroke="#6fcf97" stroke-width="2"/><text x="494" y="238" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#6fcf97" text-anchor="start" font-weight="800" letter-spacing="0">✓ Nie das falsche Ziel</text><text x="494" y="272" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">die Daten einer Verbindung erreichen nie das Ziel einer anderen Verbindung</text><text x="1140" y="224" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#6fcf97" text-anchor="end" font-weight="800" letter-spacing="2">BEWIESEN</text><rect x="470" y="316" width="690" height="110" fill="#141a14" stroke="#6fcf97" stroke-width="2"/><text x="494" y="360" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#6fcf97" text-anchor="start" font-weight="800" letter-spacing="0">✓ Immer zurück nach Hause</text><text x="494" y="394" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">sobald die Ausfälle enden, kehrt das Netz vollständig zur ursprünglichen Konfiguration zurück</text><text x="1140" y="346" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#6fcf97" text-anchor="end" font-weight="800" letter-spacing="2">BEWIESEN</text><text x="40" y="462" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">jede Konfiguration und jedes Muster ausgefallener Switches für den Prüfer offen</text><text x="40" y="492" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">Begrenzte Prüfungen von 20 bis 44 Takten · die längste Prüfung lief 27 Stunden</text></svg>