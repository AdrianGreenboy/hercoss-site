<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img"><rect width="1100" height="360" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">WHY A CIRCUIT PLANE · 1.6 Tb/s ETHERNET OVER 512-BIT LANES</text><text x="40" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">One 512-bit link</text><text x="40" y="126" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">would need 3.1 GHz</text><rect x="380" y="86" width="540.0" height="40" fill="#5b6675" stroke="#5b6675" stroke-width="2" /><text x="932.0" y="113" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">3.1 GHz</text><text x="40" y="180" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Circuit lane ceiling on FPGA</text><text x="40" y="202" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">567–583 MHz → 6 lanes</text><rect x="380" y="162" width="99.36" height="40" fill="#f2a03d" stroke="#f2a03d" stroke-width="2" /><text x="491.36" y="189" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">~575 MHz</text><text x="40" y="256" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Packet router on FPGA</text><text x="40" y="278" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">closes at 400 MHz</text><rect x="380" y="238" width="69.12" height="40" fill="#5b9bd5" stroke="#5b9bd5" stroke-width="2" /><text x="461.12" y="265" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">400 MHz</text><text x="40" y="330" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">FPGA figures (AMD Versal VE2302, -1LP). The clock of the final chip depends on the production node.</text></svg>