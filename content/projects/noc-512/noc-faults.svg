<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"><rect width="1200" height="300" fill="#0d1014"/><text x="40" y="48" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="3">FAULT INJECTION ON FPGA SILICON</text><rect x="40.0" y="72" width="357.3333333333333" height="190" fill="#151a21" stroke="#3a4350" stroke-width="2" /><text x="64.0" y="134" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="40" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="0">10.5 million</text><text x="64.0" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">flits with a flipped bit</text><text x="64.0" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">corrected while traffic kept flowing;</text><text x="64.0" y="222" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">double-bit errors detected</text><rect x="421.3333333333333" y="72" width="357.3333333333333" height="190" fill="#151a21" stroke="#3a4350" stroke-width="2" /><text x="445.3333333333333" y="134" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="40" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">160 million</text><text x="445.3333333333333" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">clock cycles of continuous attack</text><text x="445.3333333333333" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">one of the three control-state copies in</text><text x="445.3333333333333" y="222" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">every router corrupted on every cycle</text><rect x="802.6666666666666" y="72" width="357.3333333333333" height="190" fill="#151a21" stroke="#3a4350" stroke-width="2" /><text x="826.6666666666666" y="134" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="40" fill="#6fcf97" text-anchor="start" font-weight="700" letter-spacing="0">48 million</text><text x="826.6666666666666" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">AXI4 bursts during that attack</text><text x="826.6666666666666" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">without a single error</text></svg>