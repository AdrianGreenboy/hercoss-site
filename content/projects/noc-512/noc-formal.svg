es deep with every waiting time reachable, 24 with the real ones.</text><rect x="620" y="250" width="540" height="140" fill="#151a21" stroke="#3a4350" stroke-width="2" rx="10"/><text x="644" y="290" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Hardened = basic, under faults</text><text x="644" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">with faults injected at will, the hardened logic</text><text x="644" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">behaves exactly like the basic one,</text><text x="644" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">checked 16 cycles deep.</text></svg>