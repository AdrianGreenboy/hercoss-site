<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"><rect width="1200" height="420" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">ONE DEAD SWITCH AT A TIME · SIX SWITCHES TESTED · RTL SIMULATION OF THE FULL CHIP PLAN</text><text x="380" y="84" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">TIME UNTIL A LANE IS BACK</text><text x="860" y="84" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="2">LANES BACK WHILE SWITCH IS DEAD</text><rect x="30" y="110" width="1140" height="84" fill="#151a21" stroke="#0d1014" stroke-width="2" /><text x="50" y="148" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9aa4b2" text-anchor="start" font-weight="700" letter-spacing="0">No repair</text><text x="50" y="172" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">until the switch recovers</text><rect x="380" y="136" width="420" height="30" fill="none" stroke="#e07a6b" stroke-width="2" stroke-dasharray="6 6"/><text x="590" y="157" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#e07a6b" text-anchor="middle" font-weight="700" letter-spacing="0">lanes stay cut</text><rect x="860" y="136" width="200" height="30" fill="#0d1014" stroke="#3a4350" stroke-width="1" /><text x="1072" y="157" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">0 %</text><rect x="30" y="206" width="1140" height="84" fill="#151a21" stroke="#0d10