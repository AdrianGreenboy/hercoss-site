chor="middle" font-weight="400" letter-spacing="0">I/Q out</text><rect x="40" y="350" width="1120" height="80" fill="#2b3440" stroke="#3a4350" stroke-width="2" /><text x="60" y="382" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">Complex I/Q in Q1.15 · 32-bit phase NCO · software-loadable FIR · own AXI4 master streams samples to memory</text><text x="60" y="410" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Bit-identical result in six domains: Python model, two VHDL testbenches, ARM C code and two silicon reads</text></svg>