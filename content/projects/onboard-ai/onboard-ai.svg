stem-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">SNN, transformers</text><text x="518" y="282" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">~12 TMAC/s target</text><rect x="518" y="360" width="95.60000000000001" height="26" fill="none" stroke="#f2a03d" stroke-width="2" /><text x="528" y="378" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#f2a03d" text-anchor="start" font-weight="400" letter-spacing="1">IN DESIGN</text><rect x="750" y="110" width="220" height="300" fill="#151a21" stroke="#f2a03d" stroke-width="3" /><rect x="750" y="110" width="220" height="8" fill="#f2a03d" stroke="#f2a03d" stroke-width="0" /><text x="768" y="152" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="15" fill="#f2a03d" text-anchor="start" font-weight="700" letter-spacing="2">AOCS ACCELERATOR</text><text x="768" y="184" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Control</text><text x="768" y="226" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Solves the MPC</text><text x="768" y="254" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">control problem</text><text x="768" y="282" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">every control step</text><rect x="768" y="360" width="162.8" height="26" fill="none" stroke="#6fcf97" stroke-width="2" /><text x="778" y="378" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#6fcf97" text-anchor="start" font-weight="400" letter-spacing="1">VALIDATED ON FPGA</text><path d="M212 260 H244 m-12 -10 l12 10 l-12 10" fill="none" stroke="#f2a03d" stroke-width="4"/><path d="M472 260 H494 m-12 -10 l12 10 l-12 10" fill="none" stroke="#f2a03d" stroke-width="4"/><path d="M722 260 H744 m-12 -10 l12 10 l-12 10" fill="none" stroke="#f2a03d" stroke-width="4"/><rect x="1010" y="110" width="150" height="300" fill="#2b3440" stroke="#3a4350" stroke-width="2" /><text x="1085" y="150" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="2">ACTUATORS</text><text x="1085" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="middle" font-weight="400" letter-spacing="0">Reaction wheels</text><text x="1085" y="240" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="middle" font-weight="400" letter-spacing="0">Magnetorquers</text><text x="1085" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="middle" font-weight="400" letter-spacing="0">Thrusters</text><path d="M972 260 H1004 m-12 -10 l12 10 l-12 10" fill="none" stroke="#f2a03d" stroke-width="4"/><text x="40" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Decide on board instead of sending everything to the ground: less downlink, faster reaction, more autonomy.</text><text x="40" y="500" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">All three sit on the Exxo A1's 512-bit network-on-chip, 