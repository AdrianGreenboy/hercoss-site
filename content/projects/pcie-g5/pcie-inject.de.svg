<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"><rect width="1200" height="470" fill="#0d1014"/><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="gacc" x1="0" x2="1"><stop offset="0" stop-color="#f2a03d" stop-opacity=".5"/><stop offset="1" stop-color="#f2a03d"/></linearGradient><linearGradient id="ggrey" x1="0" x2="1"><stop offset="0" stop-color="#59626f" stop-opacity=".5"/><stop offset="1" stop-color="#59626f"/></linearGradient><linearGradient id="gblue" x1="0" x2="1"><stop offset="0" stop-color="#5b9bd5" stop-opacity=".35"/><stop offset="1" stop-color="#5b9bd5"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#f2a03d" stop-opacity=".18"/><stop offset="1" stop-color="#f2a03d" stop-opacity="0"/></radialGradient><pattern id="die" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#1f2630" stroke-width="1"/></pattern></defs><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="1.5">AUF SILIZIUM INJIZIERTE FEHLER, WÄHREND DIE VERBINDUNG DATEN TRÄGT</text><text x="1160" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#f2a03d" text-anchor="end" font-weight="700" letter-spacing="2">PATENTPRÜFUNG LÄUFT</text><text x="40" y="86" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="1.5">FEHLER</text><text x="390" y="86" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="1.5">ERGEBNIS</text><text x="850" y="86" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="1.5">ÜBRIGE DREI LANES</text><text x="1040" y="86" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="1.5">DATENMODUS</text><rect x="30" y="102" width="1140" height="64" fill="#151a21" stroke="#3a4350" stroke-width="1.5" /><text x="48" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Ein gekipptes Bit</text><text x="390" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">Erkannt, der richtigen Lane zugeordnet, Verbindung bleibt bestehen</text><text x="915" y="142" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="22" fill="#6fcf97" text-anchor="middle" font-weight="800" letter-spacing="0">0</text><text x="1095" y="140" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#6fcf97" text-anchor="middle" font-weight="700" letter-spacing="0">✓ gehalten</text><rect x="30" y="178" width="1140" height="64" fill="#1a1712" stroke="#f2a03d" stroke-width="1.5" /><text x="48" y="216" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Störung im Descrambler des Empfängers</text><text x="390" y="216" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#f2a03d" text-anchor="start" font-weight="600" letter-spacing="0">Vom Empfänger selbst repariert · 438 Wörter betroffen (~4 µs)</text><text x="915" y="218" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="22" fill="#6fcf97" text-anchor="middle" font-weight="800" letter-spacing="0">0</text><text x="1095" y="216" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#6fcf97" text-anchor="middle" font-weight="700" letter-spacing="0">✓ gehalten</text><rect x="30" y="254" width="1140" height="64" fill="#1a1712" stroke="#f2a03d" stroke-width="1.5" /><text x="48" y="292" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Bit-Slip in der Taktrückgewinnung einer Lane</text><text x="390" y="292" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#f2a03d" text-anchor="start" font-weight="600" letter-spacing="0">Vom Empfänger selbst repariert · 724 Wörter verloren (~7 µs)</text><text x="915" y="294" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="22" fill="#6fcf97" text-anchor="middle" font-weight="800" letter-spacing="0">0</text><text x="1095" y="292" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#6fcf97" text-anchor="middle" font-weight="700" letter-spacing="0">✓ gehalten</text><rect x="30" y="330" width="1140" height="64" fill="#151a21" stroke="#3a4350" stroke-width="1.5" /><text x="48" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Neutraining unter Verkehr</text><text x="390" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">54 Millionen Wörter, keines fehlerhaft oder verloren</text><text x="915" y="370" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle" font-weight="800" letter-spacing="0">—</text><text x="1095" y="368" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle" font-weight="700" letter-spacing="0">—</text><text x="40" y="440" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Die Standardlösung für die Descrambler-Störung und den Bit-Slip ist eine Link-Recovery, die Millisekunden dauert.</text></svg>