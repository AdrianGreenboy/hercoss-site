nt-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">NoC lane 3</text><text x="530.0" y="304" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">512 bits</text><rect x="600" y="90" width="140" height="170" fill="#10141a" stroke="#3a4350" stroke-width="2" /><text x="670.0" y="286" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">NoC lane 4</text><text x="670.0" y="304" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">512 bits</text><rect x="740" y="90" width="140" height="170" fill="#10141a" stroke="#3a4350" stroke-width="2" /><text x="810.0" y="286" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">NoC lane 5</text><text x="810.0" y="304" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">512 bits</text><rect x="880" y="90" width="140" height="170" fill="#10141a" stroke="#3a4350" stroke-width="2" /><text x="950.0" y="286" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">NoC lane 6</text><text x="950.0" y="304" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">512 bits</text><rect x="1020" y="90" width="140" height="170" fill="#10141a" stroke="#3a4350" stroke-width="2" /><text x="1090.0" y="286" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">NoC lane 7</text><text x="1090.0" y="304" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400" letter-spacing="0">512 bits</text><rect x="44" y="130" width="216.0" height="90" fill="#f2a03d" stroke="#f2a03d" stroke-width="2" opacity="0.85"/><text x="152.0" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#0d1014" text-anchor="middle" font-weight="700" letter-spacing="0">frame A ends</text><rect x="268.0" y="130" width="244.0" height="90" fill="#5b9bd5" stroke="#5b9bd5" stroke-width="2" opacity="0.85"/><text x="390.0" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#0d1014" text-anchor="middle" font-weight="700" letter-spacing="0">frame B</text><rect x="520.0" y="130" width="90.0" height="90" fill="#6fcf97" stroke="#6fcf97" stroke-width="2" opacity="0.85"/><text x="565.0" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#0d1014" text-anchor="middle" font-weight="700" letter-spacing="0">C</text><rect x="618.0" y="130" width="300.0" height="90" fill="#b48ead" stroke="#b48ead" stroke-width="2" opacity="0.85"/><text x="768.0" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#0d1014" text-anchor="middle" font-weight="700" letter-spacing="0">frame D</text><rect x="926.0" y="130" width="230.0" height="90" fill="#f2a03d" stroke="#f2a03d" stroke-width="2" opacity="0.85"/><text x="1041.0" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#0d1014" text-anchor="middle" font-weight="700" letter-spacing="0">frame E starts</text><text x="40" y="350" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#e6e9ee" text-anchor="start" font-weight="400" letter-spacing="0">Several Ethernet frames can start and end inside one clock cycle. ETH_1T6 is built for that from the start,</text><text x="40" y="376" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">and its 4,096-bit width equals eight NOC_512 lanes, so data moves to the rest of the chip without conversion.</text></svg>