<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"><rect width="1200" height="440" fill="#0d1014"/><text x="40" y="46" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="3">ONE DESIGN, EVERY SPEED · DATAPATH WIDTH SET BY ONE PARAMETER</text><text x="40" y="106" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">1/8 width</text><text x="40" y="128" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">512 bits / cycle</text><rect x="330" y="86" width="95" height="44" fill="#6fcf97" stroke="#6fcf97" stroke-width="3" /><text x="439" y="106" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">328 MHz on FPGA, timing met</text><text x="439" y="126" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">≈ 168 Gb/s equivalent</text><text x="40" y="188" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">1/4 width</text><text x="40" y="210" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">1,024 bits / cycle</text><rect x="330" y="168" width="190" height="44" fill="#6fcf97" stroke="#6fcf97" stroke-width="3" /><text x="534" y="188" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">> 250 MHz on FPGA, timing met</text><text x="534" y="208" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">≈ 260 Gb/s equivalent</text><text x="40" y="270" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">1/2 width</text><text x="40" y="292" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">2,048 bits / cycle</text><rect x="330" y="250" width="380" height="44" fill="#10141a" stroke="#5b9bd5" stroke-width="3" stroke-dasharray="8 6"/><text x="724" y="270" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">verified in simulation</text><text x="40" y="352" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">Full width</text><text x="40" y="374" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">4,096 bits / cycle</text><rect x="330" y="332" width="760" height="44" fill="#10141a" stroke="#f2a03d" stroke-width="3" stroke-dasharray="8 6"/><text x="346" y="352" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e6e9ee" text-anchor="start" font-weight="700" letter-spacing="0">verified in simulation</text><text x="346" y="372" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#f2a03d" text-anchor="start" font-weight="400" letter-spacing="0">1.6 Tb/s in the Exxo A1</text><text x="40" y="420" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#9aa4b2" text-anchor="start" font-weight="400" letter-spacing="0">Green: placed and routed on the FPGA. Dashed: verified in simulation. Equivalent rates = width × clock on the FPGA.</text></svg>