# ---------------------------------------------------------------- English
[languages.en]
  label = "EN"
  locale = "en"
  weight = 1
  [languages.en.params]
    seotitle = "Hercoss — Radiation-hardened RISC-V chips and FPGA SoCs for space"
    tagline = "The New Way of Doing Engineering"
    description = "Hercoss designs chips and IP cores for space and high-performance systems: RISC-V processors, its own FPGA fabric and high-speed links. Its flagship is the HERCOSS Exxo A1, a 128-bit RISC-V FPGA SoC for space, open to investors and partners."
  [[languages.en.menus.main]]
    name = "Exxo A1"
    pageRef = "/projects/hercoss-exxo-a1"
