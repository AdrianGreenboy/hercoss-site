# IP core catalogue.
# estado: "validado" (validated on FPGA), "desarrollo" (in development) or "familia" (in the IP family, status not published)
# a1: the core's role in the HERCOSS Exxo A1 (empty if none yet)
- nombre: "RV128IMAC"
  cat: "Processors"
  estado: validado
  que: "128-bit RISC-V processor: runs as RV128, RV64 or two RV64 CPUs; Linux 6.6 SMP; core-to-core calls in 1.4 µs; hardware SHA-3 at 153× software, no driver."
  a1: "The A1's 16 processors"
- nombre: "RV32IM"
  cat: "Processors"
  estado: validado
  que: "Compact 32-bit RISC-V core that runs the firmware of the IP family's test systems on silicon."
  a1: "Always-on platform controller"
- nombre: "RV64IMAC"
  cat: "Processors"
  estado: desarrollo
  que: "64-bit RISC-V processor; its features are being carried over into the RV128IMAC."
  a1: ""
- nombre: "NOC_512"
  cat: "Interconnect"
  estado: validado
  que: "Self-repairing 512-bit network-on-chip, packet and stream planes: 3.19 trillion AXI4 transfers on FPGA silicon with zero errors; re-routes itself in ~10 µs with no word lost."
  a1: "Joins every block of the chip"
- nombre: "NPU"
  cat: "AI and control"
  estado: validado
  que: "INT8 CNN inference on an 8 × 8 systolic array: 0.333 ms per image, ~3,000 inferences/s on FPGA silicon."
  a1: "Building block of the AI Engine"
- nombre: "AOCS / ADCS MPC accelerator"
  cat: "AI and control"
  estado: validado
  que: "Solves the attitude-control MPC problem (70 × 70, 32-bit float) in hardware; bit-identical from simulation to silicon."
  a1: "Attitude and orbit control acceleration"
- nombre: "RF digital front-end"
  cat: "RF and signal"
  estado: validado
  que: "Software-defined radio DDC and DUC: NCO, mixer, CIC, 16-tap FIR, AGC/RSSI, own DMA to memory."
  a1: "Basis of the A1-RF variant"
- nombre: "DSP"
  cat: "RF and signal"
  estado: familia
  que: "Digital signal-processing engine."
  a1: "Basis of the A1's 5 DSP cores"
- nombre: "Sigma-delta ADC chain"
  cat: "RF and signal"
  estado: validado
  que: "Digital decimation chain of a sigma-delta ADC: ~16.4 to ~18.9 effective bits, DMA to memory."
  a1: "10 × 24-bit ΣΔ ADC"
- nombre: "ETH_1T6"
  cat: "Links"
  estado: desarrollo
  que: "Complete 1.6 Tb/s Ethernet link layer: MAC, PCS, Reed-Solomon FEC, 16-lane alignment. On FPGA silicon: 312 billion frames in one hour, zero errors; full width verified in simulation."
  a1: "The 1.6TbE port"
- nombre: "SERDES_256G v1.0"
  cat: "Links"
  estado: validado
  que: "Multi-lane serial link with Hercoss's own 64B/66B coding: 103 Gb/s on 4 lanes, 1-hour soak with zero errors."
  a1: "Basis of the 72-lane transceiver pool"
- nombre: "PCS_40G"
  cat: "Links"
  estado: validado
  que: "40GBASE-R physical coding: links up with a commercial 40G network card on all four lanes."
  a1: "Ethernet PCS family"
- nombre: "MAC_40G v0.3"
  cat: "Links"
  estado: validado
  que: "40G Ethernet MAC: FCS, PAUSE, address filter, hardware UDP generator; ping and 1-hour soak against a commercial NIC. v0.4 in progress."
  a1: "Ethernet MAC family"
- nombre: "PCS_25G + MAC_25G"
  cat: "Links"
  estado: validado
  que: "25G Ethernet with a 64B/66B Clause 49 encoder."
  a1: "Ethernet up to 16 × 25G"
- nombre: "MAC_10G"
  cat: "Links"
  estado: familia
  que: "10 Gigabit Ethernet MAC."
  a1: "10G Ethernet ports"
- nombre: "Octal 25G Ethernet"
  cat: "Links"
  estado: familia
  que: "Eight 25G Ethernet ports in one core, 200 Gb/s in total."
  a1: "Multi-port 25G Ethernet"
- nombre: "ETH"
  cat: "Links"
  estado: familia
  que: "Ethernet controller for general networking."
  a1: "Management Ethernet"
- nombre: "TSN switch"
  cat: "Links"
  estado: familia
  que: "Time-Sensitive Networking switch: deterministic, scheduled Ethernet for control traffic."
  a1: "TSN on every Ethernet port"
- nombre: "PTP / IEEE 802.1AS"
  cat: "Links"
  estado: validado
  que: "Network clock synchronisation with hardware time-stamping."
  a1: "Common time base for every Ethernet port"
- nombre: "PCIe"
  cat: "Links"
  estado: desarrollo
  que: "PCI Express controller for high-bandwidth expansion."
  a1: "3 × Gen5 x16"
- nombre: "MIPI CSI-2"
  cat: "Links"
  estado: desarrollo
  que: "Camera and image-sensor interface; PHY layer in scope."
  a1: "2 ×"
- nombre: "SpaceWire"
  cat: "Space"
  estado: validado
  que: "ESA's standard link for instrument data."
  a1: "10 ×"
- nombre: "MIL-STD-1553"
  cat: "Space"
  estado: validado
  que: "Command and control bus with long flight heritage."
  a1: "5 ×"
- nombre: "CAN"
  cat: "Space"
  estado: validado
  que: "Robust bus for spacecraft subsystems."
  a1: "10 ×"
- nombre: "USART"
  cat: "General"
  estado: validado
  que: "Serial port for console, telemetry and maintenance."
  a1: "5 ×"
- nombre: "I²C / I³C"
  cat: "General"
  estado: validado
  que: "Sensor and housekeeping buses, including the newer I³C."
  a1: "5 × I²C + 5 × I³C"
- nombre: "SPI"
