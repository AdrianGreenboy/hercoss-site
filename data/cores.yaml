- nombre: "SHA-3 / Keccak engine"
  cat: "Security"
  estado: validado
  que: "SHA3-224/256/384/512 and SHAKE, one round per cycle; 99.8 MB/s from a Linux program without a driver, 153× software."
  a1: "Hardware base for post-quantum crypto"
- nombre: "ECC scrubber"
  cat: "Security"
  estado: familia
  que: "Background memory scrubber: finds and corrects bit errors in memory before they accumulate."
  a1: "Memory protection against radiation"
- nombre: "ML-KEM / ML-DSA"
  cat: "Security"
  estado: validado
  que: "Post-quantum key exchange and signature accelerators, with key zeroisation for flight."
  a1: "Post-quantum engine; signed FPGA bitstreams"
