<div class="cards">
  {{ range . }}
  <a class="card" href="{{ .RelPermalink }}">
    {{ with .Resources.GetMatch "cover.*" }}
      {{ with .Fill "800x500 Center" }}
      <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" loading="lazy">
      {{ end }}
    {{ end }}
    <div class="card-body">
      {{ with .Params.estado }}<p class="card-estado">{{ . }}</p>{{ end }}
      <h3>{{ .Title }}</h3>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </div>
  </a>
  {{ end }}
</div>
