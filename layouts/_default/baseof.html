<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "seo.html" . }}
  {{ with .Params.csp }}<meta http-equiv="Content-Security-Policy" content="{{ replace . "{api}" site.Params.api }}">{{ end }}
  {{ if .Params.private }}<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow">{{ end }}
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ "/" | relURL }}">HERCOSS</a>
    <nav>
      {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <span>© {{ now.Year }} Hercoss</span>
    <span>
      <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      <a href="{{ site.Params.github }}">GitHub</a>
      {{ range site.Menus.footer }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    </span>
  </footer>
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</body>
</html>
