{{- $p := .Page -}}
<div class="shots">
  {{- range $i, $s := (slice (dict "f" "a1-layout" "c" (.Get 0)) (dict "f" "a1-layout-detail" "c" (.Get 1))) }}
  {{- $img := $p.Resources.Get (printf "%s.jpg" $s.f) -}}
  {{- $hd := $p.Resources.Get (printf "%s-hd.jpg" $s.f) -}}
  <figure class="shot{{ if eq $i 0 }} shot-main{{ end }}">
    <a href="{{ $hd.RelPermalink }}" target="_blank" rel="noopener" aria-label="{{ i18n "open_full" }}">
      <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $s.c }}" loading="lazy">
      <span class="shot-tag">{{ if eq $i 0 }}{{ i18n "shot1" }}{{ else }}{{ i18n "shot2" }}{{ end }}</span>
    </a>
    <figcaption>{{ $s.c }}</figcaption>
  </figure>
  {{- end }}
</div>
