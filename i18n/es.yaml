m1_l: "CPU de 128 bits"
m1_t: "La máquina completa de 128 bits: cada registro y cada operación aritmética tienen 128 bits. Brilla en aritmética de números grandes y en criptografía, donde el doble de ancho de palabra significa menos pasos."
m2_l: "CPU de 64 bits"
m2_t: "Un procesador RISC-V estándar de 64 bits. Linux, FreeRTOS, Zephyr, RTEMS y los compiladores habituales funcionan sin cambios, así que todo el software RISC-V existente está disponible desde el primer día."
m3_l: "2 CPUs de 64 bits"
m3_t: "El mismo silicio se comporta como dos procesadores independientes de 64 bits, cada uno con su propio programa. Linux corre como un sistema SMP de dos CPUs en un solo núcleo: el doble de CPUs sin el doble de área."
