m1_l: "128-Bit-CPU"
m1_t: "Die vollständige 128-Bit-Maschine: Jedes Register und jede arithmetische Operation ist 128 Bit breit. Sie glänzt bei Großzahlarithmetik und Kryptografie, wo doppelte Wortbreite weniger Schritte bedeutet."
m2_l: "64-Bit-CPU"
m2_t: "Ein standardkonformer 64-Bit-RISC-V-Prozessor. Linux, FreeRTOS, Zephyr, RTEMS und die üblichen Compiler laufen unverändert, sodass die gesamte vorhandene RISC-V-Software vom ersten Tag an verfügbar ist."
m3_l: "2 × 64-Bit-CPUs"
m3_t: "Dasselbe Silizium verhält sich wie zwei unabhängige 64-Bit-Prozessoren mit jeweils eigenem Programm. Linux läuft als SMP-System mit zwei CPUs auf einem einzigen Kern: doppelt so viele CPUs ohne doppelte Fläche."
