m1_t: "The full 128-bit machine: every register and every arithmetic operation is 128 bits wide. It shines on big-number maths and cryptography, where twice the word width means fewer steps."
m2_l: "64-bit CPU"
m2_t: "A standard 64-bit RISC-V processor. Linux, FreeRTOS, Zephyr, RTEMS and the normal compilers run unchanged, so the whole existing RISC-V software world is available on day one."
m3_l: "2 × 64-bit CPUs"
m3_t: "The same silicon behaves as two independent 64-bit processors, each with its own program. Linux runs as a two-CPU SMP system on a single core: twice the CPUs without twice the area."
